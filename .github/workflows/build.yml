name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: |
          ZIP=$(ls ScreenDubArabic-v0*.zip | sort -V | tail -1)
          unzip -q -o "$ZIP"
      - name: Arabic OCR model
        working-directory: ScreenDubArabic
        run: curl -L -o app/src/main/assets/tessdata/ara.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ara.traineddata
      - name: Build APK
        working-directory: ScreenDubArabic
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenDubArabic-apk
          path: ScreenDubArabic/app/build/outputs/apk/release/*.apk
